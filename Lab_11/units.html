<!DOCTYPE html>
<html>
<head>
    <title>CSS Units</title>

    <style>
        .box-px {
            width: 200px;
            height: 40px;
            background-color: lightblue;
            margin-bottom: 15px;
        }

        .box-percent {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>CSS Units Example</h1>

    <div class="box-px">200px wide box</div>

    <div class="box-percent">50% wide box</div>

    <p>This paragraph uses a font size of 1.5rem.</p>

</body>
</html>
