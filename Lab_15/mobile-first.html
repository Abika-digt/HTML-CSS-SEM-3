<!DOCTYPE html>
<html>
<head>
    <title>Mobile First Responsive Page</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 10px;
            padding: 20px;
        }

        @media (min-width: 600px) {
            .cards {
                flex-direction: row;
            }

            .card {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Cards</h1>

    <div class="cards">

        <div class="card">
            <h2>Card One</h2>
            <p>This is the first responsive card.</p>
        </div>

        <div class="card">
            <h2>Card Two</h2>
            <p>This is the second responsive card.</p>
        </div>

    </div>

</body>
</html>
