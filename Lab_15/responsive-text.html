<!DOCTYPE html>
<html>
<head>
    <title>Responsive Text</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 1rem;
        }

        h1 {
            font-size: 1.5rem;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Typography</h1>

    <p>
        This page demonstrates responsive text using CSS media queries.
        The heading changes its font size according to the screen width.
    </p>

</body>
</html>
