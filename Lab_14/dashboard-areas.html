<!DOCTYPE html>
<html>
<head>
    <title>Grid Dashboard</title>

    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: #1d3557;
            color: white;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightblue;
        }

        .main {
            grid-area: main;
            background-color: lightgreen;
        }

        .footer {
            grid-area: footer;
            background-color: lightgray;
        }

        .dashboard div {
            padding: 25px;
            border: 1px solid navy;
        }
    </style>
</head>
<body>

    <h1>CSS Grid Dashboard</h1>

    <div class="dashboard">

        <div class="header">Header</div>

        <div class="sidebar">Sidebar</div>

        <div class="main">Main Content</div>

        <div class="footer">Footer</div>

    </div>

</body>
</html>
