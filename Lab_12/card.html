<!DOCTYPE html>
<html>
<head>
    <title>CSS Card</title>

    <style>
        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 12px;
            padding: 16px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h1>CSS Card Example</h1>

    <div class="card">
        <h3>Welcome to My Card</h3>
        <p>This card demonstrates background colour, border, border radius and padding.</p>
    </div>

</body>
</html>
