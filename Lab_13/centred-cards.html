<!DOCTYPE html>
<html>
<head>
    <title>Centred Cards</title>

    <style>
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 300px;
        }

        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 10px;
            padding: 20px;
            width: 150px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Centred Cards using Flexbox</h1>

    <div class="row">

        <div class="card">
            <h3>Starter</h3>
            <p>₹199</p>
        </div>

        <div class="card">
            <h3>Standard</h3>
            <p>₹349</p>
        </div>

        <div class="card">
            <h3>Premium</h3>
            <p>₹499</p>
        </div>

    </div>

</body>
</html>
