<!DOCTYPE html>
<html>
<head>
    <title>Wrapping Cards</title>

    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            background-color: lightgreen;
            border: 2px solid darkgreen;
            border-radius: 10px;
            padding: 20px;
            width: 150px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Stationery Shop</h1>

    <div class="container">

        <div class="card">
            <h3>Notebook</h3>
            <p>₹60</p>
        </div>

        <div class="card">
            <h3>Pen</h3>
            <p>₹15</p>
        </div>

        <div class="card">
            <h3>Bag</h3>
            <p>₹350</p>
        </div>

        <div class="card">
            <h3>Book</h3>
            <p>₹120</p>
        </div>

    </div>

</body>
</html>
